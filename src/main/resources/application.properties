# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
# CRITICAL: Railway provides a dynamic PORT environment variable
# This MUST be used for the web server, NOT hardcoded to any value
server.port=${PORT:8080}

# ============================================================================
# TELEGRAM BOT CONFIGURATION
# ============================================================================
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}
telegram.bot.clear-webhook-on-startup=${TELEGRAM_CLEAR_WEBHOOK_ON_STARTUP:true}

# ============================================================================
# BIBLE API CONFIGURATION
# ============================================================================
bible.api.base-url=${BIBLE_API_BASE_URL:https://rest.api.bible/v1}
bible.api-bible.key=${BIBLE_API_KEY}
bible.api-bible.default-version=${BIBLE_API_DEFAULT_VERSION:de4e12af7f28f599-01}
bible.api-bible.timeout=${BIBLE_API_TIMEOUT:5000}

bible.youversion.base-url=${YOUVERSION_BASE_URL:https://api.youversion.com}
bible.youversion.key=${YOUVERSION_API_KEY}
bible.youversion.default-version=${YOUVERSION_DEFAULT_VERSION:111}
bible.youversion.timeout=${YOUVERSION_TIMEOUT:5000}

bible.esv.base-url=${ESV_API_BASE_URL:https://api.esv.org}
bible.esv.token=${ESV_API_TOKEN}
bible.esv.timeout=${ESV_API_TIMEOUT:5000}

# ============================================================================
# MONGODB CONFIGURATION
# ============================================================================
# Connection URI - Use the mongodb+srv:// format for Atlas
spring.data.mongodb.uri=${MONGODB_URI}

# DO NOT set the database in URI if you're setting it here
# The database should be in the URI or here, not both
# If your URI includes /eccprayerbot, remove this line:
# spring.data.mongodb.database=${MONGODB_DATABASE:eccprayerbot}

# Auto-create indexes
spring.data.mongodb.auto-index-creation=true

# Connection timeouts (important for Railway to Atlas latency)
spring.data.mongodb.connect-timeout=15000
spring.data.mongodb.socket-timeout=15000
spring.data.mongodb.server-selection-timeout=30000

# ============================================================================
# SUPABASE ANALYTICS CONFIGURATION
# ============================================================================
analytics.supabase.enabled=${SUPABASE_ANALYTICS_ENABLED:false}
analytics.supabase.jdbc-url=${SUPABASE_DB_URL:${DATABASE_URL:}}
analytics.supabase.username=${SUPABASE_DB_USERNAME:}
analytics.supabase.password=${SUPABASE_DB_PASSWORD:}
analytics.supabase.schema=${SUPABASE_DB_SCHEMA:public}
analytics.supabase.maximum-pool-size=${SUPABASE_DB_MAX_POOL_SIZE:5}
analytics.supabase.minimum-idle=${SUPABASE_DB_MIN_IDLE:1}
analytics.supabase.connection-timeout-ms=${SUPABASE_DB_CONNECTION_TIMEOUT_MS:10000}
analytics.supabase.validation-timeout-ms=${SUPABASE_DB_VALIDATION_TIMEOUT_MS:5000}
analytics.supabase.idle-timeout-ms=${SUPABASE_DB_IDLE_TIMEOUT_MS:600000}
analytics.supabase.max-lifetime-ms=${SUPABASE_DB_MAX_LIFETIME_MS:1800000}
analytics.access.admin-token=${ANALYTICS_ADMIN_TOKEN:}
analytics.backfill.enabled=${ANALYTICS_BACKFILL_ENABLED:false}
analytics.backfill.batch-size=${ANALYTICS_BACKFILL_BATCH_SIZE:500}
analytics.backfill.time-zone=${ANALYTICS_BACKFILL_TIME_ZONE:UTC}

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
logging.level.root=INFO
logging.level.com.mapharitechnologies.eccprayerbot=INFO
logging.level.org.mongodb.driver=INFO
logging.level.org.springframework.data.mongodb=DEBUG

# ============================================================================
# CACHING CONFIGURATION
# ============================================================================
spring.cache.type=simple
spring.cache.cache-names=bibleVerses

# ============================================================================
# CIRCUIT BREAKER CONFIGURATION
# ============================================================================
resilience4j.circuitbreaker.instances.bibleApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.bibleApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bibleApi.wait-duration-in-open-state=60s

resilience4j.circuitbreaker.instances.apiBible.sliding-window-size=10
resilience4j.circuitbreaker.instances.apiBible.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.apiBible.wait-duration-in-open-state=60s

resilience4j.circuitbreaker.instances.esvApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.esvApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.esvApi.wait-duration-in-open-state=60s
