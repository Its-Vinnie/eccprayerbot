# Server Configuration - CRITICAL: Use Railway's dynamic PORT
server.port=${PORT:8080}

  # Telegram Bot Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}

  # Bible API Configuration
bible.api.base-url=${BIBLE_API_BASE_URL:https://rest.api.bible/v1}
bible.api-bible.key=${BIBLE_API_KEY}
bible.api-bible.default-version=${BIBLE_API_DEFAULT_VERSION:de4e12af7f28f599-01}
bible.api-bible.timeout=${BIBLE_API_TIMEOUT:5000}

bible.youversion.base-url=${YOUVERSION_BASE_URL:https://api.youversion.com}
bible.youversion.key=${YOUVERSION_API_KEY}
bible.youversion.default-version=${YOUVERSION_DEFAULT_VERSION:111}
bible.youversion.timeout=${YOUVERSION_TIMEOUT:5000}

# MongoDB Configuration
# Ensure MONGODB_URI is correctly passed from Railway environment variables.
# For Atlas, it usually looks like: mongodb+srv://<user>:<password>@cluster.mongodb.net/dbname?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:eccprayerbot}
spring.data.mongodb.auto-index-creation=true

# MongoDB connection settings for high-latency environments (Railway to Atlas)
spring.data.mongodb.connect-timeout=10000
spring.data.mongodb.socket-timeout=10000
spring.data.mongodb.server-selection-timeout=30000

# SSL/TLS Configuration for MongoDB Atlas
# If you get "Received fatal alert: internal_error", ensure your IP is whitelisted in Atlas
# and try adding tls=true to your connection string.

  # Logging
logging.level.root=INFO
logging.level.com.mapharitechnologies.eccprayerbot=INFO

  # Caching
spring.cache.type=simple
spring.cache.cache-names=bibleVerses

  # Circuit Breakers
resilience4j.circuitbreaker.instances.bibleApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.bibleApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bibleApi.wait-duration-in-open-state=60s

resilience4j.circuitbreaker.instances.apiBible.sliding-window-size=10
resilience4j.circuitbreaker.instances.apiBible.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.apiBible.wait-duration-in-open-state=60s